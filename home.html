<!DOCTYPE html>
    <head>
	<title>Window</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> 
    </head>
    <body type="text/html">
        <div class="window inactive" id="helloworld">
            <div class="window-header">
              <div class="window-text">Test</div>
            </div>
            <div class="window-content">
                <div class="window-sidebar">
                    <p>Hello World</p>
                    <ul><li>OPTION</li></ul>
                </div>
                <div class="window-body">
                    <p>Hello World</p>
                </div>
            </div>
			<div class="glass"></div>
			<div class="highlights"></div>
				
        </div>

        <div class="window inactive" id="secondwindow">
            <div class="window-header">
              <div class="window-text">Second Window</div>
            </div>
            <div class="window-content">
            <div class="window-body">
                <p>This is a second window.</p>
		<i>You can tell because there's more than one of them.</i>
            </div>
            </div>
			<div class="glass"></div>
			<div class="highlights"></div>
        </div>

        <div class="window active" id="musicplayer">
            <div class="window-header">
              <div class="window-text">Music Player</div>
            </div>
            <div class="window-content">
            <div class="window-body" style="text-align: center; align-content: center;">
                <br>
                <audio controls src="/backgroundMusic.mp3" type="audio/mpeg"></audio>
                <br>
		        <i style="font-size:small; color:grey;">PlayStation 3 Photo Gallery - BGM 9</i>
		        <p></p>
		        <i style="font-size:small; color:grey;">Sony Computer Entertainment</i>
            </div>
            </div>
			<div class="glass"></div>
			<div class="highlights"></div>
        </div>
    </body>
    <style type="text/css">
        :root {
            background:transparent;
        }

        .window-content {
            display:flex;
            flex-direction: row;
            transition: 0.1s;
        }

        .window-body {
            text-align: left;
            padding:0 5px 0 5px;
            flex:2;
            resize: both;
            overflow: scroll;
            background-color: rgba(82, 82, 82, 0.2);
            border-radius: 5px;
            margin:5px;
        }

        .window-sidebar {
            max-width: 10%;
            min-width: fit-content;
            padding:0 5px 0 5px;
            text-align: left;
            flex: 1;
            background-color: rgba(82, 82, 82, 0.2);
            border-radius: 5px;
            margin:5px;
        }
        
        .window-info {
            text-align: left;
            margin: 5px;
        }
		
		
		.highlights {
			background: linear-gradient(180deg,rgba(255, 255, 255, 1) 10%, rgba(127, 127, 127, 1) 25%, rgba(127, 127, 127, 1) 85%, rgba(0, 0, 0, 1) 100%);
			mask-image: radial-gradient(75% 75% at 50% 50%, #0FF0 60%, #FFFFFF5D 100%);
			
			position: absolute;
			top: 0;
			left: 0;
			width:100%;
			height:100%;
			z-index: -99;
		}
		
		.glass {
			background-image: url(/aero.png);
			
			background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
			
			position: absolute;
			top: 0;
			left: 0;
			width:100%;
			height:100%;
			z-index: -99;
		}

        .window {
            position: absolute;
            border-radius: 5px;
            text-align: center;
            background-color: rgba(216, 222, 233, 0.3);
            border: 2px solid;
	        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
	        backdrop-filter: blur(2px);
	        -webkit-backdrop-filter: blur(2px);
        }

        .window-header {
            padding: 10px;
            font-weight: bold;
            cursor: move;
	        touch-action: none;
        }

        .active {
            border-color: #8fbcbb7F;
            color: black;
        }

        .inactive {
            border-color: #4c566a7F;
            color: grey;
        }
    </style>
    <style type="text/css">
        #helloworld {
            top: 167px;
            left:372px;
        }
        #helloworld .window-body {
            width: 271px;
            height: 157px;
        }

        #secondwindow {
            top: 214px;
            left: 589px;
        }
        #secondwindow .window-body {
            width:566px;
            height: 212px;
        }

        #musicplayer {
            top: 365px;
            left: 332px;
        }

        #musicplayer .window-body {
            width: 520px;
            height: 230px;
        }
    </style>
    <script type="text/javascript">
        var windows = document.querySelectorAll(".window");

        windows.forEach(grabWindow);

        function grabWindow(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onpointerdown = updateSort;
            elmnt.children[0].onpointerdown = startMovingWindow;
            
            function startMovingWindow(e) {
                e = e || window.event;
                e.preventDefault();
                
                let touch = (e.touches && e.touches[0]) || (e.pointerType && e.pointerType === 'touch' && e);
                let clientX = (touch || e).clientX;
                let clientY = (touch || e).clientY;
                
                pos3 = clientX;
                pos4 = clientY;
                document.onpointerup = stopMovingWindow;
                document.onpointermove = moveWindow;
            }   
            function updateSort() {
                windows.forEach(window => {
					if (window.style.zIndex > 1) {
						window.style.zIndex = window.style.zIndex - 1;
					}
                    window.classList.add('inactive');
                    window.classList.remove('active');
                });
                elmnt.classList.remove('inactive');
                elmnt.classList.add('active');
                elmnt.style.zIndex = "99";
            }

            function moveWindow(e) {
                e = e || window.event;
                e.preventDefault();
                
                let touch = (e.touches && e.touches[0]) || (e.pointerType && e.pointerType === 'touch' && e);
                let clientX = (touch || e).clientX;
                let clientY = (touch || e).clientY;
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function stopMovingWindow() {
                document.onpointerup = null;
                document.onpointermove = null;
            }
        }
    </script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
    <script type="text/javascript">
        function loadPosts(data) {
           data.forEach(post => {
                var win = document.createElement("div");
                win.className = "window inactive";
                win.id = post.id;

                var header = document.createElement("div");
                header.className = "window-header";
                win.appendChild(header);
        
                var headertext = document.createElement("div");
                headertext.className = "window-text";
                headertext.innerText = post.title;
                header.appendChild(headertext);

                var poster = document.createElement("div");
                poster.className = "window-info";
                var posterinfo = document.createElement("a");
                var posterimage = document.createElement("img");
                posterimage.src = post.user.avatar_url;
                posterimage.style.height = "20px";
                posterinfo.appendChild(posterimage);
                posterinfo.innerHTML = posterinfo.innerHTML + post.user.login;
                posterinfo.href = post.user.html_url;	
                poster.appendChild(posterinfo)
                win.appendChild(poster);

                var content = document.createElement("div");
                content.className = "window-content";
                win.appendChild(content);

                var postbody = document.createElement("div");
                postbody.className = "window-body";
                var postbodycontent={};
                postbodycontent.text = post.body;
                $.post("https://api.github.com/markdown", JSON.stringify(postbodycontent))
                .done(function(msg) {
                    postbody.innerHTML = msg;
                });
                postbody.style.width = "270px";
                content.appendChild(postbody);

                var reactions = document.createElement("div");
                reactions.className = "window-info";
                reactions.innerText = post.reactions.total_count + " reactions";
                win.appendChild(reactions);

                var glass = document.createElement("div");
                glass.className = "glass";
                win.appendChild(glass);

                var highlights = document.createElement("div");
                highlights.className = "highlights";
                win.appendChild(highlights);

                document.body.appendChild(win);
                win.style.top = Math.floor(Math.random() * (window.innerHeight-win.getBoundingClientRect().height)) + "px";
                win.style.left = Math.floor(Math.random() * (window.innerWidth-win.getBoundingClientRect().width)) + "px";


                windows = document.querySelectorAll(".window");
                grabWindow(win);
           });
        }

        $(document).ready(function() {
            $.ajax("https://api.github.com/repos/GarinHamburg/garinhamburg.github.io/discussions", {
                headers: { Accept: "application/vnd.github.json" },
                success: function(msg){
                    loadPosts(msg);
                }
            });
        });
    </script>
</html>
